<!doctype html>
<html lang="fr" data-theme="editorial">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KAIROS STUDIO — Turning Ideas Into Experiences</title>
    <meta
      name="description"
      content="KAIROS STUDIO, fondé par Joseph Kouamé — Studio créatif et numérique polyvalent : design graphique, production audiovisuelle, communication digitale, solutions TIC et création de sites web."
    />
    <meta name="theme-color" content="#0B0B0C" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Google Fonts : Cormorant Garamond, Instrument Serif & Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Anti-FOUC thème + restauration route SPA GitHub Pages (404.html) -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('kairos-theme');
          if (savedTheme === 'nocturne' || savedTheme === 'editorial') {
            document.documentElement.setAttribute('data-theme', savedTheme);
          }
          var redirect = sessionStorage.getItem('kairos-gh-redirect');
          if (redirect) {
            sessionStorage.removeItem('kairos-gh-redirect');
            if (redirect && redirect !== location.pathname + location.search + location.hash) {
              history.replaceState(null, '', redirect);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
