name: Keep Supabase Project Active

on:
  schedule:
    # Exécution tous les 4 jours à 08h00 UTC (< seuil d'inactivité de 7 jours du plan gratuit Supabase)
    - cron: '0 8 */4 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Supabase Auth & REST availability
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Variables VITE_SUPABASE_URL ou VITE_SUPABASE_ANON_KEY absentes dans GitHub Actions."
            exit 1
          fi

          BASE_URL="${SUPABASE_URL%/}"

          # 1. Vérifier GoTrue (Auth) — HTTP 200 strict attendu
          AUTH_CODE=$(curl -sS --connect-timeout 10 --max-time 20 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -o /dev/null -w "%{http_code}" \
            "${BASE_URL}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}" || echo "000")

          echo "Supabase Auth health status: HTTP ${AUTH_CODE}"
          if [ "${AUTH_CODE}" != "200" ]; then
            echo "::error::Supabase Auth indisponible ou projet en pause (HTTP ${AUTH_CODE})."
            exit 1
          fi

          # 2. Vérifier PostgREST / PostgreSQL (maintient l'activité DB) — HTTP 200 strict attendu
          REST_CODE=$(curl -sS --connect-timeout 10 --max-time 20 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -o /dev/null -w "%{http_code}" \
            "${BASE_URL}/rest/v1/projects?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" || echo "000")

          echo "Supabase REST keep-alive status: HTTP ${REST_CODE}"
          if [ "${REST_CODE}" != "200" ]; then
            echo "::error::Supabase REST/DB indisponible ou mal configuré (HTTP ${REST_CODE})."
            exit 1
          fi

          echo "Supabase keep-alive OK (Auth=200, REST=200)."
